name: Publish to npm

# Publish-only. `pnpm bumpp` owns versioning: it bumps package.json,
# commits, tags and pushes, and the tag push below triggers this run.
#
# This workflow must NEVER bump the version itself. It used to, on
# workflow_dispatch, which double-bumped every release run after a local
# bumpp and silently skipped a version on npm (v0.5.35 exists as a git
# tag but was never published).
on:
  # Primary path: `pnpm bumpp patch --yes` pushes the tag, this fires.
  push:
    tags:
      - 'v*'
  # Fallback: a manually created GitHub release. Releases created by
  # GITHUB_TOKEN (changelogithub in release.yml) do NOT trigger workflows,
  # so this only fires for releases a person creates.
  release:
    types: [created]
  # Manual retry — publishes whatever version package.json holds on the
  # selected ref. Use after fixing NPM_TOKEN or a transient failure.
  workflow_dispatch:

# One publish at a time per ref, so a tag push and a release created for
# the same version cannot race each other to the registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
